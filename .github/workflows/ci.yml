# Human-owned. Agent tokens have no Workflows permission, and the reviewer rejects PRs touching .github/.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected paths
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -Eq '^(\.github/|LICENSE$)'; then
            echo "::error::PR modifies .github/ or LICENSE (human-owned)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "No package yet."
            exit 0
          fi
          python -m pip install --quiet --upgrade pip
          if grep -q '^\s*dev\s*=' pyproject.toml; then
            pip install --quiet -e ".[dev]"
          else
            pip install --quiet -e . pytest
          fi
          pytest -q
