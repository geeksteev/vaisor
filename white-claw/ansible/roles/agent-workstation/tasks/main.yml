---
- name: Fail early if this role's secrets are missing from the vault
  ansible.builtin.assert:
    that:
      - agent_github_token | trim | length > 0
      - agent_anthropic_key | trim | length > 0
    fail_msg: "vault.yml is missing the GitHub or Anthropic key for role '{{ agent_role }}'"
    quiet: true
  no_log: true

- name: Base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - jq
      - ca-certificates
      - gnupg
      - python3
      - python3-pip
      - python3-venv
      - python3-pytest
      - python3-yaml
      - pipx
      - build-essential
      - unattended-upgrades
      - util-linux # flock
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: GitHub CLI apt keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: GitHub CLI apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: Install gh
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ agent_home }}/bin", mode: "0755" }
    - { path: "{{ agent_home }}/work", mode: "0755" }
    - { path: "{{ agent_home }}/state", mode: "0700" }
    - { path: "{{ agent_home }}/.claude", mode: "0700" }
    - { path: "{{ agent_home }}/.config/white-claw", mode: "0700" }
    - { path: "{{ agent_home }}/.config/git/hooks", mode: "0755" }

- name: Install Claude Code (native installer)
  become_user: "{{ agent_user }}"
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ agent_home }}/.local/bin/claude"

- name: Install PlatformIO for local firmware builds (builder only)
  become_user: "{{ agent_user }}"
  ansible.builtin.command: pipx install platformio
  args:
    creates: "{{ agent_home }}/.local/bin/pio"
  when: agent_role == 'builder'

- name: Secrets directory (root only)
  ansible.builtin.file:
    path: "{{ agent_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Secrets env file (root 0600; systemd reads it, the agent user can't)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ agent_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Remove the old agent-readable secrets file
  ansible.builtin.file:
    path: "{{ agent_home }}/.config/white-claw/env"
    state: absent

- name: Git config
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ agent_home }}/.gitconfig"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"

- name: Global pre-push hook (blocks pushes to main)
  ansible.builtin.copy:
    src: pre-push
    dest: "{{ agent_home }}/.config/git/hooks/pre-push"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Role instructions (~/.claude/CLAUDE.md)
  ansible.builtin.template:
    src: "CLAUDE-{{ agent_role }}.md.j2"
    dest: "{{ agent_home }}/.claude/CLAUDE.md"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"

- name: Claude Code permissions
  ansible.builtin.template:
    src: "settings-{{ agent_role }}.json.j2"
    dest: "{{ agent_home }}/.claude/settings.json"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"

- name: Output parser used by the reviewer and planner scripts
  ansible.builtin.copy:
    src: wc-parse.py
    dest: "{{ agent_home }}/bin/wc-parse.py"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Per-repo cycle script for this role
  ansible.builtin.template:
    src: "{{ agent_role }}-run.sh.j2"
    dest: "{{ agent_home }}/bin/agent-repo.sh"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Dispatcher (runs the cycle once per repo)
  ansible.builtin.template:
    src: agent-run.sh.j2
    dest: "{{ agent_home }}/bin/agent-run.sh"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: One-time move of single-repo state and clone to the per-repo layout
  become_user: "{{ agent_user }}"
  ansible.builtin.shell: |
    set -e
    slug=geeksteev__animatronic-head
    mkdir -p "$HOME/state/$slug"
    if [ -d "$HOME/work/animatronic-head/.git" ] && [ ! -e "$HOME/work/$slug" ]; then
      mv "$HOME/work/animatronic-head" "$HOME/work/$slug"
    fi
    find "$HOME/state" -maxdepth 1 -type f ! -name dispatch.lock -exec mv -t "$HOME/state/$slug" {} +
    touch "$HOME/state/.migrated-multirepo"
  args:
    creates: "{{ agent_home }}/state/.migrated-multirepo"

- name: Clone every repo
  become_user: "{{ agent_user }}"
  ansible.builtin.git:
    repo: "https://github.com/{{ item }}.git"
    dest: "{{ agent_home }}/work/{{ item | replace('/', '__') }}"
    version: main
    update: false
  loop: "{{ agent_repos }}"
  failed_when: false   # an empty or not-yet-created repo is fine; the dispatcher clones it later

- name: systemd service + timer
  ansible.builtin.template:
    src: "white-claw-agent.{{ item }}.j2"
    dest: "/etc/systemd/system/white-claw-agent.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd

- name: Flush handlers before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable timer
  ansible.builtin.systemd:
    name: white-claw-agent.timer
    enabled: true
    state: started
