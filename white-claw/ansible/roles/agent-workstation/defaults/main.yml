---
# Set per host in inventory: builder | reviewer | planner
agent_role: builder

agent_user: agent
agent_home: "/home/{{ agent_user }}"
# Every repo the agents work on. Each gets its own clone under ~/work/<owner>__<name>
# and its own state under ~/state/<owner>__<name>. Add the repo to every agent PAT too.
agent_repos:
  - geeksteev/animatronic-head
  - geeksteev/vaisor

# Secrets file: root-owned, read by systemd before it drops to the agent user,
# so code running as the agent (including PR code under test) can't read it.
agent_env_file: /etc/white-claw/agent.env

# How often the agent wakes up to look for work
agent_interval: 10min

# Hard stops per run
agent_max_turns_build: 60
agent_max_turns_review: 30
agent_max_turns_plan: 30
agent_max_fix_attempts: 3
agent_max_issues_per_goal: 8
agent_max_suggestions_per_review: 5
# Most reviewer follow-ups the planner may auto-approve per day (stops review->work->review chains)
agent_triage_daily_cap: 4

# Secrets come from ansible/vault.yml (loaded via vars_files in the playbook)
agent_tokens:
  builder:
    github: "{{ vault_github_agent_token | default('') }}"
    anthropic: "{{ vault_anthropic_builder_key | default('') }}"
  reviewer:
    github: "{{ vault_github_reviewer_token | default('') }}"
    anthropic: "{{ vault_anthropic_reviewer_key | default('') }}"
  planner:
    github: "{{ vault_github_planner_token | default('') }}"
    anthropic: "{{ vault_anthropic_planner_key | default('') }}"

agent_github_token: "{{ agent_tokens[agent_role].github }}"
agent_anthropic_key: "{{ agent_tokens[agent_role].anthropic }}"
